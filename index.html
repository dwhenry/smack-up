<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaze Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;600&display=swap">
<style>
  /* Layout: the same cartoon sky as the games; a row of big picture tiles you open by looking at them. */
  :root {
    --sky-top: #4FB8F5;
    --sky-low: #BFEBFF;
    --ink: #1F2A44;
    --sun: #FFC93C;
    --pop: #FF4F79;
    --grass: #6CCB4A;
    --paper: #FFFFFF;
    --muted: #56627F;
    --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --body: "Fredoka", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--sky-top), var(--sky-low) 70%, var(--grass) 70%, var(--grass));
    background-attachment: fixed;
    color: var(--ink); font-family: var(--body);
  }
  main { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: clamp(24px, 6vh, 64px) 40px;
         display: grid; gap: clamp(20px, 4vh, 40px); }
  header { text-align: center; display: grid; gap: 8px; justify-items: center; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(52px, 11vmin, 120px); line-height: .95;
       color: #fff; -webkit-text-stroke: .07em var(--ink); paint-order: stroke fill; text-shadow: 0 .09em 0 var(--pop);
       transform: rotate(-2deg); text-wrap: balance; }
  header p { margin: 0; font-size: clamp(18px, 3vmin, 26px); font-weight: 600; }

  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 340px)); justify-content: center; gap: clamp(16px, 3vw, 32px); }
  .tile { --p: 0; position: relative; display: grid; gap: 6px; padding: 16px 16px 22px; border-radius: 24px; background: var(--paper);
          color: var(--ink); text-decoration: none; box-shadow: 0 8px 0 rgba(31, 42, 68, .18), 0 16px 30px rgba(31, 42, 68, .18);
          transition: transform .15s ease-out; overflow: hidden; }
  .tile:hover, .tile.looking { transform: translateY(-4px) rotate(-1deg); }
  .tile:focus-visible { outline: 5px solid var(--ink); outline-offset: 4px; }
  .tile .art { aspect-ratio: 1; max-width: 100%; border-radius: 16px; background: radial-gradient(circle at 50% 40%, #FFF3C4, var(--sun)); display: grid; place-items: center; }
  .tile .art svg { width: 88%; height: 88%; }
  .tile h2 { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4vw, 40px); line-height: 1; }
  .tile p { margin: 0; color: var(--muted); font-size: 17px; }
  .tile .bar { position: absolute; left: 0; bottom: 0; height: 10px; width: calc(var(--p) * 100%); background: var(--pop); }
  .tile.soon { background: rgba(255, 255, 255, .55); box-shadow: none; border: 3px dashed rgba(31, 42, 68, .35); }
  .tile.soon .art { background: rgba(255, 255, 255, .5); font-family: var(--display); font-size: clamp(80px, 14vw, 140px); color: rgba(31, 42, 68, .3); }

  footer { text-align: center; font-size: 15px; color: var(--ink); }
  footer a { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover, .tile.looking { transform: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Gaze Games</h1>
    <p>Look at a game and keep looking to play.</p>
  </header>

  <section class="games" aria-label="Games">
    <a class="tile" href="smack-up/" data-dwell>
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- ears, head, hair -->
          <circle cx="40" cy="112" r="13" fill="#F2BE91" stroke="#1F2A44" stroke-width="4"/>
          <circle cx="160" cy="112" r="13" fill="#F2BE91" stroke="#1F2A44" stroke-width="4"/>
          <circle cx="100" cy="110" r="62" fill="#F6CBA2" stroke="#1F2A44" stroke-width="4"/>
          <path d="M52 86C50 52 78 40 100 44C126 40 152 54 148 86C138 70 120 64 104 70C90 60 66 66 52 86Z" fill="#7A4E2D" stroke="#1F2A44" stroke-width="4" stroke-linejoin="round"/>
          <!-- cream drips, then the splat -->
          <g fill="#FFF7E3" stroke="#D9BE7E" stroke-width="3">
            <rect x="80" y="134" width="13" height="44" rx="6.5"/>
            <rect x="110" y="140" width="11" height="32" rx="5.5"/>
            <rect x="132" y="126" width="10" height="38" rx="5"/>
            <path d="M58 108C50 86 70 68 88 76C96 60 118 62 124 76C142 66 162 84 152 102C166 114 156 136 140 136C142 154 122 160 110 150C100 164 76 158 76 144C56 148 44 126 58 108Z"/>
            <circle cx="36" cy="64" r="6"/><circle cx="170" cy="60" r="5"/><circle cx="26" cy="146" r="4"/><circle cx="176" cy="140" r="7"/><circle cx="150" cy="40" r="3.5"/>
          </g>
          <path d="M84 96C90 88 108 86 118 94" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".8"/>
          <!-- one surprised eye peeking out -->
          <path d="M64 80Q76 70 90 78" fill="none" stroke="#1F2A44" stroke-width="4" stroke-linecap="round"/>
          <circle cx="78" cy="98" r="12" fill="#fff" stroke="#1F2A44" stroke-width="3.5"/>
          <circle cx="81" cy="100" r="5.5" fill="#1F2A44"/>
          <!-- the pie tin sliding off -->
          <g transform="rotate(-22 150 160)">
            <path d="M118 152L184 152L176 172L126 172Z" fill="#D9A35A" stroke="#1F2A44" stroke-width="3.5" stroke-linejoin="round"/>
            <ellipse cx="151" cy="152" rx="35" ry="7" fill="#F0C27B" stroke="#1F2A44" stroke-width="3.5"/>
            <path d="M126 160H176M128 166H174" stroke="#B37E3C" stroke-width="2"/>
          </g>
        </svg>
      </div>
      <h2>Smack Up</h2>
      <p>Family photos float down. Stare at one and SPLAT, it gets a pie in the face.</p>
      <span class="bar"></span>
    </a>

    <div class="tile soon" aria-label="More games on the way">
      <div class="art" aria-hidden="true">?</div>
      <h2>Coming soon</h2>
      <p>More games on the way.</p>
    </div>
  </section>

  <footer>For grown-ups: <a href="https://github.com/dwhenry/smack-up/blob/main/smack-up/README.md">how to set up Smack Up with your family's photos</a></footer>
</main>

<script>
(() => {
  // Looking at a tile long enough opens it, using the same "how long to look" setting as the games.
  let dwell = 1.0;
  try { dwell = Number(JSON.parse(localStorage.getItem('smackup.settings') || '{}').dwell) || 1.0; } catch {}
  const need = Math.max(1.2, dwell * 1.5);
  const tiles = [...document.querySelectorAll('[data-dwell]')];
  let pointer = null, last = performance.now(), opened = false;
  const held = new Map(tiles.map(t => [t, 0]));
  addEventListener('pointermove', e => { pointer = { x: e.clientX, y: e.clientY }; }, { passive: true });
  document.documentElement.addEventListener('mouseleave', () => { pointer = null; });
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (const t of tiles) {
      const r = t.getBoundingClientRect();
      const over = pointer && pointer.x > r.left && pointer.x < r.right && pointer.y > r.top && pointer.y < r.bottom;
      const v = over ? held.get(t) + dt : Math.max(0, held.get(t) - dt * 2);
      held.set(t, v);
      t.classList.toggle('looking', !!over);
      t.style.setProperty('--p', Math.min(1, v / need).toFixed(3));
      if (v >= need && !opened) { opened = true; location.href = t.href; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
